function story(){return `<div class="screen screen-light demo-wiggle">${head()}<div class="page-content"><div class="eyebrow" style="color:#ab7258">A RIDE WORTH REMEMBERING</div><h1>THAT<br>WAS A<br><em>GOOD ONE.</em></h1><p class="page-lead">A little mountain air. A little rain. And apparently, excellent coffee.</p><div class="postcard"><svg viewBox="0 0 340 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="340" height="220" fill="#e2b68c"/><circle cx="266" cy="45" r="29" fill="#f8d3a3"/><path d="M0 121Q55 68 107 117T210 110T340 98V220H0" fill="#a7a994"/><path d="M0 152Q50 102 105 149T220 130T340 142V220H0" fill="#758c79"/><path d="M0 172Q59 142 112 178T231 157T340 162V220H0" fill="#466b5b"/><path d="M86 220C127 184 172 199 192 173s5-29 33-43" stroke="#f5e0b3" stroke-width="23" fill="none"/><path d="M86 220C127 184 172 199 192 173s5-29 33-43" stroke="#bb976c" stroke-dasharray="4 16" stroke-width="1.5" fill="none"/></svg><div class="posttitle">SUNDAY IN THE<br>MAGALIESBERG</div></div><div class="stats-row"><div class="stat"><b>146 <small style="font-size:17px">km</small></b><span>Distance · simulated</span></div><div class="stat"><b>3h 12m</b><span>Duration · simulated</span></div></div><div class="eyebrow" style="color:#85877d">THE LITTLE MOMENTS</div>${[['compass','The ridge','That first glimpse of the mountains'],['cloud','Changing skies','A timely heads-up'],['coffee','One more coffee','Naturally']].map(x=>`<div class="moment-item"><span class="moment-symbol">${ic(x[0])}</span><span><b>${x[1]}</b><small>${x[2]}</small></span></div>`).join('')}<button class="outline-button" data-action="copy">${ic('share')} Copy your ride story</button><div style="height:15px"></div></div>${nav()}</div>`}

function sheet(){if(!state.panel)return '';let p=state.panel,m=S[state.scene];let inside='';if(p==='ready'){inside=`<h2>EVERYTHING IN PLACE.</h2><p>A quiet readiness check. No checklist to fight through. All values are simulated.</p>${[['pin','GPS','Demo ready'],['headset','Headset','Cardo · simulated'],['sun','Weather','Sample forecast'],['compass','Route',state.route==='mag'?'Magaliesberg loop':'Free ride']].map(a=>`<div class="sheet-row"><b>${ic(a[0])}${a[1]}</b><span>${a[2]}</span></div>`).join('')}<button class="cta sheet-cta" data-action="close">All good ${ic('check')}</button>`}

if(p==='why'){inside=`<div class="eyebrow">BEHIND THE MOMENT</div><h2>${esc(m.decision)}.</h2><p>${esc(m.why)}</p><div class="sheet-row"><b>${ic('route')}Route relevance</b><span>${state.scene===2?'Uncertain':'Simulated'}</span></div><div class="sheet-row"><b>${ic('book')}Ride memory</b><span>${state.scene===6?'Already covered':'Checked'}</span></div><div class="sheet-row"><b>${ic('headset')}Audio context</b><span>${state.scene===4?'Music playing':'Available'}</span></div><button class="cta sheet-cta" data-action="close">Back to riding ${ic('arrow')}</button>`}

function sim(){let m=S[state.scene], active=state.active,mark=state.why;return `<div class="sticker">INTERACTIVE EXPERIENCE DEMO</div><h2>${active?'PLAY THE MOMENTS.':'ONE RIDE. ONE VOICE.'}</h2><p class="studio-desc">${active?'Step through the moments to see how Betty changes what she says—and when she stays silent.':'Start the ride in the phone, then explore how Betty responds to the road.'}</p><div class="sim-card"><div class="sim-head"><span>${active?'MOMENT '+String(state.scene+1).padStart(2,'0')+' / 07':'DEMO READY'}</span><span>${active?esc(m.decision.toUpperCase()):'SIMULATED'}</span></div><div class="sim-title">${active?esc(m.title):'Take the scenic route'}</div><p class="sim-explain">${active?esc(m.short):'A voice-first prototype. No GPS, weather or bike data is being collected.'}</p><div class="sim-controls">${active?`<button class="sim-button secondary" data-action="prev" aria-label="Previous moment">${ic('back')}</button><button class="sim-button" data-action="next">Next moment ${ic('arrow')}</button>`:`<button class="sim-button" data-action="start">Start demo ${ic('arrow')}</button>`}</div>${active?`<div class="step-track" aria-label="Moment progress">${S.map((_,i)=>`<i class="${i<=state.scene?'on':''}"></i>`).join('')}</div><button class="disclosure" data-action="togglewhy"><span>Why did Betty ${esc(m.decision.toLowerCase())}?</span>${ic('chev')}</button>${mark?`<div class="why-box"><span class="decision">DIRECTOR / ${esc(m.decision.toUpperCase())}</span><div>${esc(m.why)}</div></div>`:''}`:''}</div><div class="studio-tail">Built for exploration, not for use while riding. All routes, device states and observations are illustrative.</div><div class="app-footer-mobile">↑ PHONE EXPERIENCE &nbsp; · &nbsp; DEMO CONTROLS</div>`}
let previousScreen='home';function render(){let phone=qs('#phone');phone.innerHTML=({home,ride,story,journeys,explore,settings}[state.screen]||home)()+sheet()+ (state.toast?`<div class="toast" role="status">${esc(state.toast)}</div>`:'');qs('#studio').innerHTML=sim()}

function start(){window.speechSynthesis?.cancel?.();state.active=true;state.screen='ride';state.scene=0;state.paused=false;state.panel=null;state.why=false;render();viewPhone()}
function advance(dir){if(!state.active){start();return;}state.scene=(state.scene+dir+S.length)%S.length;state.why=false;state.panel=null;state.paused=false;render();viewPhone();if(canSpeak(S[state.scene]))speech(spokenFor(S[state.scene]))}
function answerFor(q){q=(q||'').toLowerCase();let value;if(/weather|rain|cloud|temperature|forecast/.test(q))value='It’s mild right now. There may be some showers on the higher road later.';else if(/more|area|mountain|history|interesting/.test(q))value='We’re near the Magaliesberg. I can share a longer story once we stop.';else if(/ahead|route|next|road|where/.test(q))value=state.route==='free'?'No destination set. I’ll stick to what’s reliably around us.':'The Magaliesberg ridge is ahead. I’ll speak up if something is worth knowing.';else value='I’m with you. For this demo, try asking about the route, the weather or this area.';state.answer=value;state.panel='answer';render();speech(value)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;switch(a){case 'route':state.route=b.dataset.route;render();break;case 'start':start();break;case 'ready':state.panel='ready';render();break;case 'settings':previousScreen=state.screen;state.screen='settings';state.panel=null;render();break;case 'back':state.screen=previousScreen==='settings'?'home':previousScreen;render();break;case 'nav':window.speechSynthesis?.cancel?.();state.screen=b.dataset.go;state.panel=null;render();viewPhone();break;case 'story':state.screen='story';render();break;case 'selectexplore':state.route=b.dataset.route;state.screen='home';render();viewPhone();break;case 'orb':speech(state.screen==='home'?'Ready when you are. Shall we take the long way?':canSpeak(S[state.scene])?spokenFor(S[state.scene]):'Nothing urgent. Just enjoying the road with you.');break;case 'mute':state.muted=!state.muted;if(state.muted)window.speechSynthesis?.cancel?.();render();break;case 'ask':state.panel='ask';render();break;case 'question':answerFor(b.dataset.question);break;case 'send':answerFor(qs('#ask-text')?.value);break;case 'close':state.panel=null;render();break;case 'backdrop':if(e.target.closest('.sheet'))break;state.panel=null;render();break;case 'pause':state.paused=!state.paused;window.speechSynthesis?.cancel?.();state.panel=state.paused?'pause':null;render();break;case 'resume':state.paused=false;state.panel=null;render();break;case 'end':state.active=false;state.paused=false;state.screen='story';state.panel=null;window.speechSynthesis?.cancel?.();render();viewPhone();break;case 'why':state.panel='why';render();break;case 'next':advance(1);break;case 'prev':advance(-1);break;case 'togglewhy':state.why=!state.why;render();break;case 'narration':state.narration=b.dataset.style;render();break;case 'visual':state.visual=!state.visual;render();break;case 'voice-sample':speech(state.humour>60?'Another coffee stop? I admire your dedication to research.':'A good road ahead. I’ll speak up when there’s something worth knowing.');break;case 'copy':{let txt='Sunday in the Magaliesberg — 146 km, 3h 12m. A mountain ridge, changing skies, and one more coffee stop. (Demo ride story)';if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(()=>notify('Ride story copied')).catch(()=>notify('Copy not available here.'))}else{let field=document.createElement('textarea');field.value=txt;document.body.appendChild(field);field.select();try{document.execCommand('copy');notify('Ride story copied')}catch(e){notify('Copy not available here.')}field.remove()}break;}}});
document.addEventListener('input',e=>{if(e.target.dataset.input==='humour'){state.humour=+e.target.value;let n=qs('#humour-value');if(n)n.textContent=state.humour+'%'}});document.addEventListener('change',e=>{if(e.target.dataset.input==='humour')render()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.panel){state.panel=null;render()}else if(e.key==='Enter'&&e.target.id==='ask-text'){answerFor(e.target.value)}});
render();
</script></body></html>
