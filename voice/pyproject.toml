[project]
name = "betty-voice"
version = "0.1.0"
description = "Betty voice server (Pipecat): Daily, Deepgram, Claude, streamed Chirp"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[anthropic,cartesia,daily,deepgram,google,openai,runner,silero,webrtc]>=1.4.0",
    "pipecatcloud",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
