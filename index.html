<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c0f" />
  <title>Betty</title>
  <style>
    :root { --bg:#0a0c0f; --surface:#151b22; --border:#1e2832; --accent:#e8a020; --green:#3dd68c; --red:#e05555; --text:#c8d4e0; --dim:#5a6a7a; --bright:#eef3f8; }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: max(20px, env(safe-area-inset-top)) 20px 40px; max-width: 560px; margin: 0 auto; }
    h1 { color: var(--accent); font-size: 34px; font-weight: 900; letter-spacing: 4px; margin-bottom: 16px; }
    h3 { color: var(--dim); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin: 18px 0 8px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat { background: var(--surface); border: 1px solid var(--border); padding: 14px; }
    .stat .l { color: var(--dim); font-size: 11px; letter-spacing: 2px; }
    .stat .v { color: var(--bright); font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat .u { color: var(--dim); font-size: 11px; }
    button { border: 0; font-weight: 800; letter-spacing: 1px; font-size: 12px; background: var(--green); color: var(--bg); padding: 10px 12px; cursor: pointer; }
    #toggle { width: 100%; padding: 18px; margin-top: 12px; font-size: 14px; letter-spacing: 2px; }
    #toggle.stop { background: var(--red); color: #fff; }
    button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 600; letter-spacing: 0; }
    #startopts { margin-top: 12px; font-size: 13px; color: var(--dim); }
    #startopts .obd { display: block; margin-top: 8px; }
    #startopts select, #startopts input[type=text] { background: var(--bg); color: var(--bright); border: 1px solid var(--border); padding: 4px; }
    #status { color: var(--dim); font-size: 12px; margin-top: 12px; min-height: 16px; }
    #status.err { color: var(--red); }
    #lock { width: 100%; padding: 14px; margin-top: 8px; letter-spacing: 2px; }
    .lockcover { position: fixed; inset: 0; z-index: 1000; background: #000; color: #9aa; touch-action: none; user-select: none;
      -webkit-user-select: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px; text-align: center; }
    .lockcover[hidden] { display: none; }
    .locktitle { font-size: 11px; letter-spacing: 4px; color: #556; }
    .lockspeed { font-size: 96px; font-weight: 800; color: #dde; font-variant-numeric: tabular-nums; line-height: 1; }
    .lockunit { font-size: 12px; color: #556; }
    .lockline { font-size: 14px; color: #889; min-height: 60px; max-width: 480px; margin-top: 16px; }
    .lockbtn { margin-top: 24px; width: 220px; padding: 22px 0; font-size: 13px; letter-spacing: 2px; background: #111; color: #9aa;
      border: 1px solid #334; background-image: linear-gradient(#2a3a2a, #2a3a2a); background-repeat: no-repeat; background-size: 0% 100%; touch-action: none; }
    .lockbtn.holding { background-size: 100% 100%; transition: background-size var(--hold, 1000ms) linear; }
    #wake { font-size: 12px; margin-top: 6px; }
    #wake.ok { color: var(--green); }
    #wake.err { color: var(--red); font-weight: 700; }
    #feeds { color: var(--dim); font-size: 12px; margin-top: 6px; }
    #log { margin-top: 16px; display: grid; gap: 6px; font-size: 13px; }
    #log .fate { color: var(--dim); font-size: 11px; }
    .panel { margin-top: 20px; border: 1px solid var(--border); padding: 12px 14px; background: var(--surface); }
    .panel summary { cursor: pointer; color: var(--accent); font-weight: 800; letter-spacing: 3px; font-size: 12px; }
    .info { margin-top: 10px; font-size: 12px; color: var(--green); }
    .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
    .row .name { flex: 0 0 150px; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
    .row input[type=range] { flex: 1; min-width: 0; }
    .row input[type=number] { width: 72px; background: var(--bg); color: var(--bright); border: 1px solid var(--border); padding: 4px; }
    .row select { background: var(--bg); color: var(--bright); border: 1px solid var(--border); padding: 4px; }
    .row .val { flex: 0 0 64px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
    .check { display: block; font-size: 12px; margin: 6px 0; color: var(--text); }
    .row .check { margin: 0; }
    .bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  </style>
</head>
<body>
  <h1>BETTY</h1>
  <div class="grid">
    <div class="stat"><div class="l">SPEED</div><div class="v" id="speed">0</div><div class="u">km/h</div></div>
    <div class="stat"><div class="l">LEAN</div><div class="v" id="lean">0</div><div class="u">° GPS estimate</div></div>
    <div class="stat"><div class="l">RPM</div><div class="v" id="rpm">0</div><div class="u">mock</div></div>
    <div class="stat"><div class="l">TEMP</div><div class="v" id="temp">0</div><div class="u">°C mock</div></div>
    <div class="stat"><div class="l">FUEL</div><div class="v" id="fuel">0</div><div class="u">% mock</div></div>
    <div class="stat"><div class="l">RAIN</div><div class="v" id="rain">-</div><div class="u">% next hour</div></div>
    <div class="stat"><div class="l">ALTITUDE</div><div class="v" id="alt">-</div><div class="u">m</div></div>
    <div class="stat"><div class="l">HEADING</div><div class="v" id="dir">-</div><div class="u" id="dirsrc">&nbsp;</div></div>
    <div class="stat"><div class="l">JOLTS</div><div class="v" id="jolts">0</div><div class="u">this ride</div></div>
  </div>
  <div id="startopts"><label><input type="checkbox" id="real" checked /> Use real phone sensors (GPS, motion). Untick on desktop to run fully simulated.</label>
    <label class="obd">Betty calls you: <input type="text" id="ridername" maxlength="20" autocomplete="off" autocapitalize="off" /></label>
    <label class="obd">Betty calls the bike: <input type="text" id="bikename" maxlength="20" autocomplete="off" autocapitalize="off" /></label>
    <label class="obd">Engine data (OBD2):
      <select id="obdmode">
        <option value="off">Off: GPS only</option>
        <option value="mock">Simulated (mock)</option>
        <option value="real" disabled>Real OBD2 (needs the hardware)</option>
      </select>
    </label>
  </div>
  <button id="toggle">START RIDE</button>
  <button id="lock" class="ghost">LOCK SCREEN</button>
  <div id="status"></div>
  <div id="wake"></div>
  <div id="feeds"></div>
  <div id="log"></div>
  <div id="sim"></div>
  <div id="tuning"></div>
  <div id="lockroot"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
