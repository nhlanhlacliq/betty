<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c0f" />
  <title>Betty</title>
  <style>
    :root { --bg:#0a0c0f; --surface:#151b22; --border:#1e2832; --accent:#e8a020; --green:#3dd68c; --red:#e05555; --text:#c8d4e0; --dim:#5a6a7a; --bright:#eef3f8; }
    * { box-sizing: border-box; margin: 0; }
    body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: max(20px, env(safe-area-inset-top)) 20px 40px; max-width: 560px; margin: 0 auto; }
    h1 { color: var(--accent); font-size: 34px; font-weight: 900; letter-spacing: 4px; margin-bottom: 16px; }
    h3 { color: var(--dim); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin: 18px 0 8px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat { background: var(--surface); border: 1px solid var(--border); padding: 14px; }
    .stat .l { color: var(--dim); font-size: 11px; letter-spacing: 2px; }
    .stat .v { color: var(--bright); font-size: 36px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat .u { color: var(--dim); font-size: 11px; }
    button { border: 0; font-weight: 800; letter-spacing: 1px; font-size: 12px; background: var(--green); color: var(--bg); padding: 10px 12px; cursor: pointer; }
    #toggle { width: 100%; padding: 18px; margin-top: 12px; font-size: 14px; letter-spacing: 2px; }
    #toggle.stop { background: var(--red); color: #fff; }
    button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 600; letter-spacing: 0; }
    #startopts { margin-top: 12px; font-size: 13px; color: var(--dim); }
    #startopts .obd { display: block; margin-top: 8px; }
    #startopts #voice { max-width: 60%; }
    #voicetest { padding: 4px 10px; margin-left: 6px; }
    #startopts select, #startopts input[type=text] { background: var(--bg); color: var(--bright); border: 1px solid var(--border); padding: 4px; }
    #status { color: var(--dim); font-size: 12px; margin-top: 12px; min-height: 16px; }
    #status.err { color: var(--red); }
    #filled { width: 100%; padding: 12px; margin-top: 8px; }
    #lock { width: 100%; padding: 14px; margin-top: 8px; letter-spacing: 2px; }
    .lockcover { position: fixed; inset: 0; z-index: 1000; background: #000; color: #9aa; touch-action: none; user-select: none;
      -webkit-user-select: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 24px; text-align: center; }
    .lockcover[hidden] { display: none; }
    .locktitle { font-size: 11px; letter-spacing: 4px; color: #556; }
    .lockspeed { font-size: 96px; font-weight: 800; color: #dde; font-variant-numeric: tabular-nums; line-height: 1; }
    .lockunit { font-size: 12px; color: #556; }
    .lockline { font-size: 14px; color: #889; min-height: 60px; max-width: 480px; margin-top: 16px; }
    .lockbtn { margin-top: 24px; width: 220px; padding: 22px 0; font-size: 13px; letter-spacing: 2px; background: #111; color: #9aa;
      border: 1px solid #334; background-image: linear-gradient(#2a3a2a, #2a3a2a); background-repeat: no-repeat; background-size: 0% 100%; touch-action: none; }
    .locktalk { margin-top: 20px; width: 260px; padding: 34px 0; font-size: 16px; letter-spacing: 3px; background: #1d2a1d; color: #cfe; border: 1px solid #3a5a3a; touch-action: manipulation; }
    .lockbtn.holding { background-size: 100% 100%; transition: background-size var(--hold, 1000ms) linear; }
    #wake { font-size: 12px; margin-top: 6px; }
    #wake.ok { color: var(--green); }
    #wake.err { color: var(--red); font-weight: 700; }
    #feeds { color: var(--dim); font-size: 12px; margin-top: 6px; }
    #log { margin-top: 16px; display: grid; gap: 6px; font-size: 13px; }
    .logview { margin-top: 10px; max-height: 340px; overflow: auto; font-size: 11px; white-space: pre-wrap; word-break: break-word; color: var(--text); user-select: text; -webkit-user-select: text; }
    .chatlist { margin-top: 10px; display: grid; gap: 8px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
    .chatempty { color: var(--dim); font-size: 12px; }
    .bubble { padding: 8px 10px; border: 1px solid var(--border); max-width: 88%; min-width: 0; }
    .bubble.rider { justify-self: end; background: var(--surface); }
    .bubble.betty { justify-self: start; border-color: var(--accent); }
    .bubble .said { font-size: 14px; color: var(--bright); }
    .bubble .meta { font-size: 11px; color: var(--dim); margin-top: 4px; }
    .bubble .fallback { display: none; font-size: 12px; color: var(--dim); margin-top: 4px; font-style: italic; }
    .chatlist.compare .bubble .fallback { display: block; }
    .bubble button.small { padding: 2px 8px; font-size: 11px; margin-top: 6px; }
    .bubble .prompt { white-space: pre-wrap; word-break: break-word; font-size: 11px; color: var(--text); background: var(--bg); padding: 8px; margin: 6px 0 0; max-height: 300px; overflow: auto; }
    .chatform { display: flex; gap: 8px; margin-top: 10px; }
    .chatform input { flex: 1; min-width: 0; background: var(--bg); color: var(--bright); border: 1px solid var(--border); padding: 8px; font-size: 14px; }
    .chatform button { width: auto; padding: 8px 16px; margin: 0; }
    .hint { color: var(--dim); font-size: 12px; margin: 4px 0 8px; }
    .presslog { font-size: 12px; color: var(--text); max-height: 120px; overflow-y: auto; white-space: pre; }
    .meter { height: 6px; background: var(--border); margin: 8px 0; }
    .meterbar { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s linear; }
    .recs { display: grid; gap: 10px; margin-top: 8px; }
    .rec { display: grid; gap: 4px; }
    .rec .meta { font-size: 11px; color: var(--dim); }
    .rec audio { width: 100%; }
    .rec a { font-size: 12px; color: var(--accent); }
    #log .fate { color: var(--dim); font-size: 11px; }
    .panel { margin-top: 20px; border: 1px solid var(--border); padding: 12px 14px; background: var(--surface); }
    .panel summary { cursor: pointer; color: var(--accent); font-weight: 800; letter-spacing: 3px; font-size: 12px; }
    .memrow { display: grid; gap: 4px; padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.08); }
    .memrow .meta { font-size: 11px; color: var(--dim); }
    .memrow a { font-size: 12px; color: var(--accent); }
    .changes { margin: 4px 0 10px; padding-left: 18px; font-size: 13px; line-height: 1.45; }
    .info { margin-top: 10px; font-size: 12px; color: var(--green); }
    .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 12px; }
    .row .name { flex: 0 0 150px; color: var(--text); overflow: hidden; text-overflow: ellipsis; }
    .row input[type=range] { flex: 1; min-width: 0; }
    .row input[type=number] { width: 72px; background: var(--bg); color: var(--bright); border: 1px solid var(--border); padding: 4px; }
    .row select { background: var(--bg); color: var(--bright); border: 1px solid var(--border); padding: 4px; }
    .row .val { flex: 0 0 64px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
    .check { display: block; font-size: 12px; margin: 6px 0; color: var(--text); }
    .row .check { margin: 0; }
    .bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    /* Nothing may be wider than the screen: a wide select or an unbroken line made the phone zoom the page out. */
    html, body { overflow-x: hidden; }
    body { overflow-wrap: anywhere; }
    select, input, textarea, button, audio, pre, img { max-width: 100%; }
    .row { flex-wrap: wrap; }
    .row select { flex: 1 1 140px; min-width: 0; }
    .row .name { flex: 0 1 150px; min-width: 0; }
    .presslog { white-space: pre-wrap; }
    /* TUNING trigger rows: the name on its own line, then priority, cooldown and "s" side by side */
    .row.trig { display: grid; grid-template-columns: minmax(0, 1fr) 84px 14px; gap: 4px 8px; margin: 10px 0; }
    .row.trig .name { grid-column: 1 / -1; color: var(--dim); }
    .row.trig select, .row.trig input[type=number] { width: 100%; }
    .row.trig .val { text-align: left; }
    /* Rounded corners */
    button { border-radius: 10px; }
    select, input[type=text], input[type=number], textarea { border-radius: 8px; }
    .panel, .stat { border-radius: 12px; }
    .bubble { border-radius: 12px; }
    .panel summary { letter-spacing: 2px; }
    /* iPhone zooms in on any field under 16px when it is tapped, and does not zoom back out. */
    select, input[type=text], input[type=number], textarea, .chatform input, .row input[type=number], .row select,
    #startopts select, #startopts input[type=text] { font-size: 16px; }
  </style>
</head>
<body>
  <h1>BETTY</h1>
  <div class="grid">
    <div class="stat"><div class="l">SPEED</div><div class="v" id="speed">0</div><div class="u">km/h</div></div>
    <div class="stat"><div class="l">LEAN</div><div class="v" id="lean">0</div><div class="u">° GPS estimate</div></div>
    <div class="stat"><div class="l">RPM</div><div class="v" id="rpm">0</div><div class="u">mock</div></div>
    <div class="stat"><div class="l">TEMP</div><div class="v" id="temp">0</div><div class="u">°C mock</div></div>
    <div class="stat"><div class="l">FUEL</div><div class="v" id="fuel">0</div><div class="u">% mock</div></div>
    <div class="stat"><div class="l">RAIN</div><div class="v" id="rain">-</div><div class="u">% next hour</div></div>
    <div class="stat"><div class="l">ALTITUDE</div><div class="v" id="alt">-</div><div class="u">m</div></div>
    <div class="stat"><div class="l">HEADING</div><div class="v" id="dir">-</div><div class="u" id="dirsrc">&nbsp;</div></div>
    <div class="stat"><div class="l">FUEL RANGE</div><div class="v" id="range">-</div><div class="u" id="rangesrc">tap FILLED UP</div></div>
    <div class="stat"><div class="l">JOLTS</div><div class="v" id="jolts">0</div><div class="u">this ride</div></div>
  </div>
  <div id="startopts"><label><input type="checkbox" id="real" checked /> Use real phone sensors (GPS, motion). Untick on desktop to run fully simulated.</label>
    <label class="obd">Rider name: <input type="text" id="ridername" maxlength="20" autocomplete="off" autocapitalize="off" /></label>
    <label class="obd">Bike name: <input type="text" id="bikename" maxlength="20" autocomplete="off" autocapitalize="off" /></label>
    <label class="obd">Cloud voice:
      <select id="cloudvoice">
        <option value="stream">Gemini for everything but alerts (answers streamed)</option>
        <option value="mixed">Gemini for her own remarks only, Chirp for alerts and answers</option>
        <option value="chirp">Google Chirp 3 HD for everything</option>
        <option value="gemini">Google Gemini for everything</option>
        <option value="off">Off: phone voice only</option>
      </select>
    </label>
    <label class="obd">Cloud voice name:
      <select id="cloudname"></select>
      <button id="cloudtest" class="ghost" type="button">Test</button>
      <button id="cloudsounds" class="ghost" type="button">Test sounds</button>
    </label>
    <label class="obd">Gemini model:
      <select id="geminimodel">
        <option value="full">Full (best sound)</option>
        <option value="lite">Lite (starts about a second sooner)</option>
      </select>
    </label>
    <label class="obd">Chirp accent (alerts):
      <select id="chirplocale">
        <option value="en-US">American</option>
        <option value="en-GB">British</option>
        <option value="en-AU">Australian</option>
        <option value="en-IN">Indian</option>
      </select>
    </label>
    <label class="obd">Phone voice (backup when there is no signal):
      <select id="voice"></select>
      <button id="voicetest" class="ghost" type="button">Test</button>
    </label>
    <label class="obd"><input type="checkbox" id="buttons" /> Headset buttons talk to Betty: play/pause to talk, next track to repeat (pauses your music)</label>
    <label class="obd">Engine data (OBD2):
      <select id="obdmode">
        <option value="off">Off: GPS only</option>
        <option value="mock">Simulated (mock)</option>
        <option value="real" disabled>Real OBD2 (needs the hardware)</option>
      </select>
    </label>
  </div>
  <button id="toggle">START RIDE</button>
  <button id="lock" class="ghost">LOCK SCREEN</button>
  <button id="filled" class="ghost">FILLED UP (reset fuel range)</button>
  <div id="status"></div>
  <div id="wake"></div>
  <div id="feeds"></div>
  <div id="log"></div>
  <div id="chat"></div>
  <div id="sim"></div>
  <div id="tuning"></div>
  <div id="voicetestpanel"></div>
  <div id="logpanel"></div>
  <div id="memorypanel"></div>
  <div id="changelogpanel"></div>
  <div id="lockroot"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
